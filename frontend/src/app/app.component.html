<main class="page">
  <section class="panel">
    <h1>Book Management</h1>
    <p>Add a new book or review the existing catalog.</p>

    <form (ngSubmit)="addBook()" #bookForm="ngForm">
      <label>
        Title
        <input [(ngModel)]="form.title" name="title" required />
      </label>

      <label>
        Author
        <input [(ngModel)]="form.author" name="author" required />
      </label>

      <label>
        Price
        <input type="number" [(ngModel)]="form.price" name="price" min="0.01" step="0.01" required />
      </label>

      <button type="submit" [disabled]="isSubmitting">{{ isSubmitting ? 'Saving…' : 'Save Book' }}</button>
    </form>

    <p class="feedback" *ngIf="feedback">{{ feedback }}</p>
  </section>

  <section class="panel">
    <h2>Books</h2>
    <div class="book-list" *ngIf="books.length; else emptyState">
      <article class="book-card" *ngFor="let book of books">
        <h3>{{ book.title }}</h3>
        <p><strong>Author:</strong> {{ book.author }}</p>
        <p><strong>Price:</strong> ${{ book.price }}</p>
      </article>
    </div>

    <ng-template #emptyState>
      <p>No books have been added yet.</p>
    </ng-template>
  </section>
</main>
